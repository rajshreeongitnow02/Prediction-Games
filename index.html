<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>

    <div class="modes" role="group" aria-label="Computer mode">
      <button type="button" class="mode" id="mode-learning" aria-pressed="true">Learning AI</button>
      <button type="button" class="mode" id="mode-random" aria-pressed="false">Random</button>
    </div>

    <div class="level-banner">
      <span class="level-tag" id="level-tag">Level 1 of 5</span>
      <span class="level-name" id="level-name">Sleepy Sloth</span>
    </div>
    <p class="goal">First to 10 wins the round</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score">
        <span class="score-label">You</span>
        <span class="score-value" id="score-player">0</span>
        <span class="meter" aria-hidden="true"><span class="meter-fill meter-player" id="meter-player"></span></span>
      </div>
      <div class="score score-draw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score">
        <span class="score-label">Computer</span>
        <span class="score-value" id="score-computer">0</span>
        <span class="meter" aria-hidden="true"><span class="meter-fill meter-computer" id="meter-computer"></span></span>
      </div>
    </section>

    <section class="arena" aria-label="Current round">
      <div class="hand-slot">
        <div class="hand" id="player-hand" aria-hidden="true"></div>
        <span class="hand-name" id="player-name">Your pick</span>
      </div>
      <div class="hand-slot">
        <div class="hand" id="computer-hand" aria-hidden="true"></div>
        <span class="hand-name" id="computer-name">Computer's pick</span>
      </div>
    </section>

    <p class="result" id="result" role="status" aria-live="polite">Choose a move to start.</p>

    <section class="choices" aria-label="Choose your move">
      <button class="choice" data-choice="rock" aria-label="Rock (press R)">
        <span class="choice-icon" data-icon="rock"></span>
        <span>Rock</span>
      </button>
      <button class="choice" data-choice="paper" aria-label="Paper (press P)">
        <span class="choice-icon" data-icon="paper"></span>
        <span>Paper</span>
      </button>
      <button class="choice" data-choice="scissors" aria-label="Scissors (press S)">
        <span class="choice-icon" data-icon="scissors"></span>
        <span>Scissors</span>
      </button>
    </section>

    <section class="ai-panel" aria-label="AI insight">
      <p id="ai-prediction">The AI learns your habits as you play.</p>
      <p id="ai-accuracy"></p>
    </section>

    <div class="actions">
      <button class="reset" id="reset" type="button">Restart level</button>
      <button class="reset" id="reset-ai" type="button">Reset AI memory</button>
    </div>
    <p class="hint">Tip: press R, P or S on your keyboard.</p>
  </main>

  <dialog class="dialog" id="match-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="dialog-icon" id="dialog-icon" aria-hidden="true"></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <button type="button" class="primary" id="dialog-action"></button>
  </dialog>

  <script src="ai.js"></script>
  <script src="script.js"></script>
</body>
</html>
